; 支持 Apple captive portal、Bonjour、局域网发现等服务，防止局域网设备失效
rule=DOMAIN-SUFFIX,captive.apple.com,DIRECT
rule=DOMAIN-SUFFIX,local,DIRECT
rule=DOMAIN-SUFFIX,lan,DIRECT
rule=DOMAIN-SUFFIX,internal,DIRECT
rule=IP-CIDR,224.0.0.251/32,DIRECT,no-resolve  ; mDNS 发现服务

;小直连规则（补充必要直连域）
